<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Order Fiktif - Wonosobo</title>
<style>
:root{--bg:#E4EBE8;--card:#fff;--ink:#17261f;--mut:#5c6f66;--pri:#1f7a55;--pri-t:#fff;--line:#cfdad4;--red:#c0392b;--amb:#c77d0a;--grn:#1f7a55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#18261f;--ink:#e6f0ea;--mut:#9bb0a5;--pri:#3fb583;--pri-t:#06180f;--line:#2a3d33;--red:#ff7b6b;--amb:#f0b04a;--grn:#3fb583}html{color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a15;--card:#18261f;--ink:#e6f0ea;--mut:#9bb0a5;--pri:#3fb583;--pri-t:#06180f;--line:#2a3d33;--red:#ff7b6b;--amb:#f0b04a;--grn:#3fb583}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
header a{color:var(--mut);text-decoration:none;font-size:14px}
h1{font-size:26px;line-height:1.2;margin:12px 0 4px}
h2{font-size:18px;margin:24px 0 10px}
p.sub{color:var(--mut);margin:0 0 16px}
.btns{display:grid;gap:10px}
.btn{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.btn b{display:block;font-size:17px}.btn span{color:var(--mut);font-size:14px}
.btn.p{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}.btn.p span{color:inherit;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:var(--pri-t);font-weight:700;width:100%;margin-top:16px}
button.g{background:transparent;color:var(--mut);border:1px solid var(--line);margin-top:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.t-red{color:var(--red)}.t-amb{color:var(--amb)}.t-grn{color:var(--grn)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.meta{color:var(--mut);font-size:13px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%}
ul{padding-left:20px;margin:8px 0}
.pl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:9px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-right:10px;flex:none}.pl img{width:28px;height:28px;object-fit:contain}.ptxt{font-size:11px;font-weight:800;padding:0 6px}
.empty{color:var(--mut);text-align:center;padding:20px}
.note{font-size:13px;color:var(--mut);margin-top:16px}
</style>
</head>
<body>
<main>
<header><a href="#beranda" id="back" hidden>← Kembali</a><span></span><a href="#setelan">Admin</a></header>
<div id="app"></div>
<p class="note">Laporan dibuat oleh sesama driver dan bersifat dugaan, bukan vonis. Gunakan untuk pertimbangan, tetap cek ulang sebelum menolak order.</p>
</main>
<script>
(function(){
var app=document.getElementById('app'),back=document.getElementById('back');
var reports=[],LS='radar_laporan_v1';
var KEC=['Garung','Kalibawang','Kalikajar','Kaliwiro','Kejajar','Kepil','Kertek','Leksono','Mojotengah','Sapuran','Selomerto','Sukoharjo','Wadaslintang','Watumalang','Wonosobo'];
function maps(k){return k?'<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Kecamatan '+k+', Wonosobo')+'" target="_blank" rel="noopener" style="color:var(--pri);font-size:14px;font-weight:600;text-decoration:none;display:inline-block;margin-top:6px">📍 Lihat di Maps</a>':''}
var PLAT=[
 {n:'Grab',img:'logo/grab.png'},
 {n:'Shopee',img:'logo/shopee.png'},
 {n:'Gojek',img:'logo/gojek.png'},
 {n:'Maxim',img:'logo/maxim.png'},
 {n:'Lainnya',img:''}
];
function badge(n){
 var p=PLAT.filter(function(x){return x.n===n})[0];if(!p)return '';
 var t='<span class=\'ptxt\'>'+esc(p.n)+'</span>';
 return '<span class="pl" title="'+esc(p.n)+'">'+(p.img?'<img src="'+p.img+'" alt="'+esc(p.n)+'" onerror="this.outerHTML=\"'+t.replace(/"/g,'&quot;')+'\"">':t)+'</span>';
}
function opts(ph){return '<option value="">'+ph+'</option>'+KEC.map(function(k){return '<option>'+k+'</option>'}).join('')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function ago(t){var m=Math.floor((Date.now()-t)/60000);if(m<1)return 'baru saja';if(m<60)return m+' mnt lalu';var h=Math.floor(m/60);if(h<24)return h+' jam lalu';return Math.floor(h/24)+' hari lalu'}
function loadLocal(){try{var r=JSON.parse(localStorage.getItem(LS)||'[]');if(Array.isArray(r))reports=r}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(reports))}catch(e){}}
loadLocal();
// === PENGATURAN: tempel URL Apps Script (berakhiran /exec) di antara tanda kutip ===
var API='GANTI_DENGAN_URL_APPS_SCRIPT';
function ready(){return API.indexOf('http')===0}
function fetchAll(){
 if(!ready())return;
 fetch(API+'?action=list').then(function(r){return r.json()}).then(function(d){
  if(!Array.isArray(d))return;
  reports=d.sort(function(x,y){return y.ts-x.ts});saveLocal();
  var r=route();if(r==='beranda'||r==='setelan')render();
 }).catch(function(){});
}
function post(o){
 return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json()});
}
fetchAll();setInterval(fetchAll,60000);

function route(){return (location.hash||'#beranda').replace('#','')||'beranda'}
function render(){
 var r=route();back.hidden=(r==='beranda');
 if(r==='cek')cek();else if(r==='lapor')lapor();else if(r==='setelan')setelan();else home();
}
function card(x){
 return (function(){var j=String(x.jenis||'Fiktif').split('|'),pf=j.length>1?j[0]:'',ly=j.length>1?j[1]:j[0];
 return '<div class="card"><div class="row"><div style="display:flex;align-items:center">'+badge(pf)+'<b>'+esc(x.area||'Wonosobo')+'</b></div><span class="tag t-red">'+esc(ly)+'</span></div>'})()+
 '<div class="meta">'+esc(x.hp?('HP …'+String(x.hp).slice(-4)):'HP tidak dicantumkan')+(x.nama?' · '+esc(x.nama):'')+' · '+ago(x.ts)+'</div>'+
 (x.catatan?'<div style="margin-top:6px">'+esc(x.catatan)+'</div>':'')+maps(x.area)+'</div>';
}

function home(){
 app.innerHTML='<h1>Radar Order Fiktif Wonosobo</h1><p class="sub">Cek dulu sebelum jalan, hemat bensin.</p>'+
 '<div class="btns"><a class="btn p" href="#cek"><b>Cek risiko order</b><span>Nilai orderan yang baru masuk</span></a>'+
 '<a class="btn" href="#lapor"><b>Lapor order fiktif</b><span>Biar driver lain tidak zonk</span></a></div>'+
 '<h2>Laporan terbaru</h2>'+(reports.length?reports.slice(0,15).map(card).join(''):'<div class="card empty">Belum ada laporan.</div>');
}
function lapor(){
 app.innerHTML='<h1>Lapor order fiktif</h1><p class="sub">Isi seperlunya. Jangan cantumkan data pribadi lengkap.</p><div class="card">'+
 '<label>Kecamatan</label><select id="a">'+opts('Pilih kecamatan')+'</select>'+
 '<label>Platform</label><select id="pl">'+PLAT.map(function(p){return '<option>'+p.n+'</option>'}).join('')+'</select>'+
 '<label>Jenis layanan</label><select id="j"><option>Makanan</option><option>Antar penumpang</option><option>Kirim barang</option></select>'+
 '<label>Nomor HP pemesan (opsional)</label><input id="h" inputmode="tel" placeholder="08xxxxxxxxxx">'+
 '<label>Nama di order (opsional)</label><input id="n">'+
 '<label>Yang terjadi</label><textarea id="c" placeholder="mis. alamat tidak ada, HP tidak aktif, nomor tidak membalas"></textarea>'+
 '<button id="go">Kirim laporan</button><div id="m" class="meta" style="margin-top:8px"></div></div>';
 document.getElementById('go').onclick=function(){
  var a=v('a').trim();if(!a){document.getElementById('m').textContent='Pilih kecamatan dulu.';return}
  var o={area:a,jenis:v('pl')+'|'+v('j'),hp:v('h').replace(/\D/g,''),nama:v('n').trim().slice(0,40),catatan:v('c').trim().slice(0,300),ts:Date.now()};
  var id='r'+o.ts+Math.floor(Math.random()*1e4);o.id=id;
  var done=function(){location.hash='#beranda'};
  reports.unshift(o);saveLocal();
  if(ready()){
   var btn=document.getElementById('go');btn.disabled=true;btn.textContent='Mengirim…';
   post(o).then(function(){fetchAll();done()}).catch(function(){document.getElementById('m').textContent='Gagal terkirim, coba lagi.';btn.disabled=false;btn.textContent='Kirim laporan'});
  }else done();
 };
}
function v(i){return document.getElementById(i).value}
function cek(){
 app.innerHTML='<h1>Cek risiko order</h1><p class="sub">Isi data order yang baru masuk.</p><div class="card">'+
 '<label>Nomor HP pemesan</label><input id="h" inputmode="tel">'+
 '<label>Nama di order</label><input id="n">'+
 '<label>Kecamatan tujuan</label><select id="a">'+opts('Tidak diketahui')+'</select>'+
 '<label>Pembayaran</label><select id="p"><option value="tunai">Tunai</option><option value="nontunai">Non-tunai</option></select>'+
 '<label>Nilai order (Rp)</label><input id="t" inputmode="numeric" placeholder="mis. 150000">'+
 '<label>Tanda yang kamu lihat</label>'+
 ['Akun/pemesan baru','Alamat tidak jelas','Chat tidak dibalas','Catatan order aneh','Pesanan banyak / tidak wajar'].map(function(s,i){return '<label style="font-weight:400;display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" class="f" value="'+i+'" style="width:auto"> '+s+'</label>'}).join('')+
 '<button id="go">Nilai risiko</button></div><div id="out"></div>';
 document.getElementById('go').onclick=function(){
  var hp=v('h').replace(/\D/g,''),nm=norm(v('n')),ar=norm(v('a')),tot=parseInt(v('t').replace(/\D/g,''))||0;
  var sc=0,why=[];
  var mh=hp.length>=6?reports.filter(function(x){return x.hp&&x.hp.slice(-8)===hp.slice(-8)}).length:0;
  if(mh){sc+=Math.min(60,30+mh*15);why.push('Nomor ini pernah dilaporkan '+mh+' kali')}
  var mn=nm.length>=3?reports.filter(function(x){return norm(x.nama)===nm}).length:0;
  if(mn){sc+=15;why.push('Nama sama pernah muncul di laporan')}
  var ma=ar.length>=3?reports.filter(function(x){return norm(x.area)===ar&&Date.now()-x.ts<864e5*3}).length:0;
  if(ma>=2){sc+=10;why.push('Area ini ramai laporan dalam 3 hari terakhir')}
  var names=['Akun/pemesan baru','Alamat tidak jelas','Chat tidak dibalas','Catatan order aneh','Pesanan banyak / tidak wajar'],w=[10,15,15,10,12];
  document.querySelectorAll('.f:checked').forEach(function(c){var i=+c.value;sc+=w[i];why.push(names[i])});
  if(v('p')==='tunai'&&tot>=100000){sc+=10;why.push('Tunai dengan nilai besar')}
  sc=Math.min(100,sc);
  var lv=sc>=60?['TINGGI','t-red','var(--red)','Sebaiknya konfirmasi dulu atau lewati.']:sc>=30?['SEDANG','t-amb','var(--amb)','Chat dan konfirmasi alamat sebelum jalan.']:['RENDAH','t-grn','var(--grn)','Tidak ada tanda mencurigakan yang tercatat.'];
  document.getElementById('out').innerHTML='<div class="card"><div class="row"><b>Risiko '+lv[0]+'</b><span class="tag '+lv[1]+'">'+sc+'/100</span></div>'+
  '<div class="meter"><i style="width:'+sc+'%;background:'+lv[2]+'"></i></div><div>'+lv[3]+'</div>'+
  (why.length?'<ul>'+why.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>':'')+maps(v('a'))+'</div>';
 };
}
function setelan(){
 app.innerHTML='<h1>Admin</h1><p class="sub">Kelola data laporan.</p><div class="card"><div class="row"><b>Total laporan</b><span>'+reports.length+'</span></div>'+
 '<div class="meta">Penyimpanan: '+(ready()?'bersama (semua driver)':'lokal di perangkat ini')+'</div>'+
 '<button class="g" id="clr">Hapus semua laporan</button></div>';
 document.getElementById('clr').onclick=function(){
  var p=prompt('Masukkan password admin:');if(!p)return;
  if(!ready()){reports=[];saveLocal();render();return}
  post({action:'clear',pass:p}).then(function(r){
   if(r&&r.ok){reports=[];saveLocal();render()}else alert('Password salah.');
  }).catch(function(){alert('Gagal terhubung.')});
 };
}
window.addEventListener('hashchange',render);render();
})();
</script>
</body>
</html>
